{{!--
  Luck overview: current / max Luck and the modifier for every crawler on the
  scene. Uses the system's `fleeting-luck` row layout, like the Mojo tracker.
--}}
<section class="{{cssClass}}">
  <div class="fleeting-luck">
    <div class="luck-sort">
      <span>{{localize 'XCC.LuckOverview.SortBy'}}</span>
      <button type="button" data-action="sortBy" data-sort="name" class="{{#if (eq sort.by 'name')}}active{{/if}}">{{localize 'XCC.LuckOverview.SortName'}}</button>
      <button type="button" data-action="sortBy" data-sort="luck" class="{{#if (eq sort.by 'luck')}}active{{/if}}" title="{{localize 'XCC.LuckOverview.SortLuckHint'}}">
        {{localize 'XCC.LuckOverview.SortLuck'}}
        {{#if (eq sort.by 'luck')}}<i class="fas {{#if (eq sort.dir 'asc')}}fa-arrow-up-1-9{{else}}fa-arrow-down-9-1{{/if}}"></i>{{/if}}
      </button>
    </div>
    <div class="fleeting-luck-users">
      {{#each actors}}
        <div class="fleeting-luck-row">
          <div class="avatar" data-action="openActorSheet" data-actor-id="{{actorId}}">
            <img src="{{img}}" title="{{name}}" alt="{{name}}"/>
          </div>
          <label class="name">{{name}}</label>
          <label class="luck-value{{#if spent}} spent{{/if}}" title="{{localize 'XCC.LuckOverview.ValueHint'}}">{{value}} / {{max}}</label>
          <label class="luck-mod" title="{{localize 'XCC.LuckOverview.ModHint'}}">{{mod}}</label>
        </div>
      {{else}}
        <p class="luck-empty">{{localize 'XCC.LuckOverview.Empty'}}</p>
      {{/each}}
    </div>
  </div>
</section>
